name: Tests
on: [push, pull_request]
# The engine needs an ordinary C++23 compiler - but one NEW ENOUGH TO REPORT ITS
# IMPORT GRAPH, or CMake cannot build modules at all, and says so in terms that
# mention neither modules nor the compiler version. Ubuntu's default is not new
# enough, so CI installs clang from apt.llvm.org.
env:
  CLANG_VERSION: "20"
jobs:
  # Formatting first, and on its own runner: it needs no submodules and no
  # build, so it answers in seconds rather than after the whole suite.
  format:
    name: "clang-format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install clang-format"
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$CLANG_VERSION"
          sudo apt-get install -y "clang-format-$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-format-$CLANG_VERSION" /usr/local/bin/clang-format
      - run: tools/format.sh --check

  cmake:
    name: "CMake + Ninja (C++23 modules)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Install ninja and clang"
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$CLANG_VERSION"
          echo "CXX=clang++-$CLANG_VERSION" >> "$GITHUB_ENV"
      - run: cmake --preset default
      - run: cmake --build --preset default
      - run: ctest --preset default
      - run: cmake --install build --prefix "$PWD/prefix"
      - name: "Upload rendered screenshots"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            build/shot-*.ppm
            build/render-*.ppm
          if-no-files-found: ignore

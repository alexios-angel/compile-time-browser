<?xml version="1.0" encoding="UTF-8"?>
<!-- A bar chart, drawn with nothing but shapes.

     NO <text>: plutosvg 0.0.8 has no text support at all, so labels would
     silently draw nothing. The tick marks below stand in for an axis, which
     keeps this file honest about what the engine can actually render.

     Committed as source rather than generated by tools/gen/gen-assets.py: that
     script exists so no foreign BINARY is committed, and an SVG is text that
     reads perfectly well in a diff. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2c5aa0"/>
      <stop offset="1" stop-color="#6ba3e8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="120" fill="#f7f7fb"/>

  <!-- axes -->
  <line x1="20" y1="10" x2="20" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="20" y1="100" x2="190" y2="100" stroke="#333" stroke-width="2"/>

  <!-- ticks, standing in for the labels a text-capable rasteriser would draw -->
  <line x1="16" y1="80" x2="20" y2="80" stroke="#333" stroke-width="1"/>
  <line x1="16" y1="55" x2="20" y2="55" stroke="#333" stroke-width="1"/>
  <line x1="16" y1="30" x2="20" y2="30" stroke="#333" stroke-width="1"/>

  <g>
    <rect x="34" y="62" width="26" height="38" fill="url(#bar)"/>
    <rect x="72" y="40" width="26" height="60" fill="url(#bar)"/>
    <rect x="110" y="24" width="26" height="76" fill="url(#bar)"/>
    <rect x="148" y="52" width="26" height="48" fill="url(#bar)"/>
  </g>

  <!-- a trend line over the bars -->
  <polyline points="47,58 85,36 123,20 161,48" fill="none" stroke="#c0392b"
            stroke-width="2" stroke-linejoin="round"/>
  <circle cx="47" cy="58" r="3" fill="#c0392b"/>
  <circle cx="85" cy="36" r="3" fill="#c0392b"/>
  <circle cx="123" cy="20" r="3" fill="#c0392b"/>
  <circle cx="161" cy="48" r="3" fill="#c0392b"/>
</svg>

<!doctype html>
<!-- Phaser 4, running on this engine.

     test/corpus/phaser/phaser_ratchet.cpp measures how far the bundle GETS - it reaches
     update(), rung 9 of 10. This is rung 10, and it is a different question:
     what does it PAINT. A scene whose create() runs and draws nothing passes
     the ratchet and fails here, which is the entire reason this page exists.

     DETERMINISM IS THE WHOLE DESIGN, because the frame is compared against a
     golden byte for byte on Linux AND on the Windows cross-build:

     * CANVAS, asked for by name. AUTO would pick a renderer, and a golden that
       silently changes which one it took is a golden that means nothing.
     * Everything is drawn in create(), and update() is empty. Phaser owns its
       own game loop, so a scene that animates would paint whatever frame the
       clock happened to land on.
     * No text, no images, no random, no physics. Rectangles, circles, lines
       and triangles through Phaser's own Graphics object - which is enough to
       exercise its display list, its transform stack and its Canvas renderer.
     * `banner: false` keeps Phaser's console art out of the run, and
       `noAudio` keeps it from asking for a device that a headless test has no
       business having. -->
<html>
  <head>
    <meta charset="utf-8">
    <script src="../../vendor/phaser/phaser.js"></script>
  </head>
  <body style="margin:0;background:#ffffff">
    <script>
      new Phaser.Game({
        type: Phaser.CANVAS,
        width: 320,
        height: 220,
        banner: false,
        audio: { noAudio: true },
        // The canvas goes in the body, which is where the page's own layout
        // puts it - there is no parent element to attach to.
        scene: {
          create: function () {
            var g = this.add.graphics();

            // A background band, so the frame is not mostly canvas default.
            g.fillStyle(0x1d2b53, 1);
            g.fillRect(0, 0, 320, 220);

            // Filled rectangles: the simplest thing the renderer can get wrong,
            // and the one that shows a transform being applied twice.
            g.fillStyle(0xff004d, 1);
            g.fillRect(20, 20, 90, 55);
            g.fillStyle(0xffa300, 1);
            g.fillRect(125, 20, 90, 55);

            // A stroked rectangle: a different path through the renderer from a
            // filled one, and the one that shows line width being ignored.
            g.lineStyle(4, 0x00e436, 1);
            g.strokeRect(230, 20, 70, 55);

            // Circles, filled and stroked. Phaser tessellates these itself, so
            // what lands here is its geometry rather than the engine's.
            g.fillStyle(0x29adff, 1);
            g.fillCircle(65, 145, 40);
            g.lineStyle(3, 0xfff1e8, 1);
            g.strokeCircle(170, 145, 40);

            // A triangle and a line, which take yet another path: an explicit
            // point list rather than a shape primitive.
            g.fillStyle(0xffec27, 1);
            g.fillTriangle(240, 185, 300, 185, 270, 105);
            g.lineStyle(2, 0xffffff, 1);
            g.lineBetween(20, 205, 300, 205);
          },
          update: function () {}
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>ctinvaders</title>
<style>
    body { padding: 0; margin: 0; background: #0a0a1e; }
    #sheet { display: none; }
</style>
</head>
<body>
<!-- The sprite sheet is an ordinary <img>. the previous engine needed a loadImage() global for
     this; drawImage takes the element itself, which is what a page would
     normally write. -->
<img id="sheet" src="examples/assets/sprites.bmp">
<canvas id="game" width="320" height="240"></canvas>
<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const sheet = document.getElementById("sheet");

    const aliens = [];
    for (let row = 0; row < 3; row++) {
        for (let column = 0; column < 6; column++) {
            aliens.push({x: 20 + column * 40, y: 20 + row * 24, alive: true});
        }
    }
    let direction = 1;
    let ship = 152;
    let bullet = null;
    let score = 0;
    let clock = 0;

    // Held keys, from keydown/keyup. the previous engine had an isKeyDown() global for this;
    // tracking it in the page is what every real game does and it needs no
    // engine support at all. Keyed by e.code - the PHYSICAL key - which is
    // also what pong reads.
    const held = {};
    document.addEventListener("keydown", function (e) {
        held[e.code] = true;
        if (e.code === "Space" && bullet === null) {
            bullet = {x: ship + 7, y: 210};
            playSound("examples/assets/blip.wav");
        }
    });
    document.addEventListener("keyup", function (e) { held[e.code] = false; });

    let previous = 0;
    function frame(now) {
        let dt = (now - previous) / 1000;
        previous = now;
        if (dt > 0.05) { dt = 0.05; }   // a long stall must not teleport anything
        clock += dt;
        const animation = Math.floor(clock * 4) % 2;

        if (held["ArrowLeft"]) { ship -= 140 * dt; }
        if (held["ArrowRight"]) { ship += 140 * dt; }
        if (ship < 0) { ship = 0; }
        if (ship > 304) { ship = 304; }

        // The formation turns when EITHER edge would leave the field, and the
        // whole formation drops - which is why this measures both edges before
        // moving anything.
        let leftmost = 999;
        let rightmost = -999;
        for (const alien of aliens) {
            if (alien.alive) {
                if (alien.x < leftmost) { leftmost = alien.x; }
                if (alien.x > rightmost) { rightmost = alien.x; }
            }
        }
        const step = 26 * dt * direction;
        if (rightmost + step > 298 || leftmost + step < 6) {
            direction = -direction;
            for (const alien of aliens) { alien.y += 8; }
        } else {
            for (const alien of aliens) { alien.x += step; }
        }

        if (bullet !== null) {
            bullet.y -= 260 * dt;
            for (const alien of aliens) {
                if (alien.alive && bullet !== null &&
                    bullet.x >= alien.x && bullet.x <= alien.x + 16 &&
                    bullet.y >= alien.y && bullet.y <= alien.y + 16) {
                    alien.alive = false;
                    bullet = null;
                    score += 10;
                    playSound("examples/assets/blip.wav");
                }
            }
            if (bullet !== null && bullet.y < -6) { bullet = null; }
        }

        ctx.fillStyle = "#0a0a1e";
        ctx.fillRect(0, 0, 320, 240);
        for (const alien of aliens) {
            if (alien.alive) {
                // The nine-argument drawImage: a cell OUT of the sheet, scaled
                // into the field. Two frames of animation, side by side.
                ctx.drawImage(sheet, animation * 8, 0, 8, 8, alien.x, alien.y, 16, 16);
            }
        }
        ctx.drawImage(sheet, 16, 0, 8, 8, ship, 216, 16, 16);
        if (bullet !== null) {
            ctx.fillStyle = "#ffff00";
            ctx.fillRect(bullet.x, bullet.y, 2, 6);
        }
        ctx.fillStyle = "#ffffff";
        ctx.fillText("SCORE " + score, 4, 12);

        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
</script>
</body>
</html>

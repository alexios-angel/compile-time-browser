<!doctype html>
<!-- Babylon.js, and a scene you can walk around with the mouse.

     DRAG TO ORBIT, WHEEL TO ZOOM. That is the whole interaction, and it is the
     point of the page: `babylon-scene.html` proves a frame can be drawn, and
     this proves the frame RESPONDS. An ArcRotateCamera reads pointer events off
     the canvas through Babylon's own input manager - nothing here handles a
     mouse - so what is being demonstrated is that the events arrive, carry the
     right coordinates, and reach a library that was written for a browser.

     THE LIGHT IS THE SUBJECT. Every surface takes its colour from a directional
     light that is nowhere in the picture: there is no lamp mesh, no emissive
     anything, and no `disableLighting`. What you see is
     `diffuse * max(0, dot(N, -L))` plus a specular term and a dim hemispheric
     fill, which means the shading is the only thing making the shapes read as
     shapes. Orbiting is what shows it: the highlight on the sphere stays put in
     WORLD space while the camera moves, which is what says the light is being
     computed in the right frame rather than pasted onto the screen.

     THE SHAPES ARE DELIBERATELY DULL - a cube, a sphere and a plane under them.
     A cube gives three flat faces at three angles to the light, a sphere gives
     a continuous gradient and the specular highlight, and the plane gives a
     large flat area where a projection or depth-test fault shows up as a shape
     rather than as a few edge pixels.

     tests/babylon_interaction.cpp drives this page with a synthetic drag and
     checks that the camera moved AND the picture changed - two different
     claims, because a camera whose angle updates while the render does not
     follow is exactly the sort of half-working this tree keeps finding. -->
<html>
  <head>
    <meta charset="utf-8">
    <title>Babylon.js - orbit</title>
    <script src="../assets/babylon/babylon.js"></script>
    <style>
      /* background-COLOR, not the `background` shorthand: the shorthand is not
         expanded here, so the page came out white below the canvas. */
      body { margin: 0; background-color: #0e0e12; color: #8a8fa0;
             font-size: 13px; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      p { margin: 8px 12px; }
    </style>
  </head>
  <body>
    <canvas id="scene" width="420" height="300"></canvas>
    <p>Drag to orbit &middot; wheel to zoom</p>
    <script>
      var canvas = document.getElementById('scene');
      var engine = new BABYLON.Engine(canvas, true);
      var scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.055, 0.055, 0.07, 1);
      // NO AMBIENT TERM. Babylon adds scene.ambientColor * material.ambientColor
      // to every surface, and leaving it on would put a constant floor under
      // the shading this page exists to show.
      scene.ambientColor = new BABYLON.Color3(0, 0, 0);

      // THE CAMERA THE MOUSE DRIVES. alpha is the angle around, beta the angle
      // above, radius the distance - which is exactly what a drag and a wheel
      // change, and why an ArcRotateCamera is the one to demonstrate with.
      var camera = new BABYLON.ArcRotateCamera(
        'orbit', -Math.PI / 2 + 0.55, 1.15, 9.5, new BABYLON.Vector3(0, 0.2, 0), scene);
      camera.lowerRadiusLimit = 4;
      camera.upperRadiusLimit = 20;
      // Kept off the floor and out of the ground plane, which is what these two
      // limits are for on a scene with something underneath it.
      camera.lowerBetaLimit = 0.15;
      camera.upperBetaLimit = Math.PI / 2 - 0.05;
      camera.attachControl(canvas, true);

      // THE LIGHT SOURCE, WHICH IS NOT VISIBLE. A directional light has no
      // position in the shading maths - only a direction - so there is nothing
      // to draw and nothing to see except its effect.
      var key = new BABYLON.DirectionalLight('key', new BABYLON.Vector3(-0.55, -1, 0.4), scene);
      key.intensity = 1.05;
      key.diffuse = new BABYLON.Color3(1, 0.97, 0.9);

      // A DIM FILL so a face turned away from the key light is dark rather than
      // black. Without it the unlit sides are 0,0,0 and "shaded correctly" and
      // "not drawn at all" look the same - which is the reading this whole
      // corpus keeps having to tell apart.
      var fill = new BABYLON.HemisphericLight('fill', new BABYLON.Vector3(0.2, 1, -0.3), scene);
      fill.intensity = 0.3;
      fill.diffuse = new BABYLON.Color3(0.55, 0.62, 0.85);
      fill.groundColor = new BABYLON.Color3(0.1, 0.1, 0.14);

      function surface(name, r, g, b, shine) {
        var m = new BABYLON.StandardMaterial(name, scene);
        m.diffuseColor = new BABYLON.Color3(r, g, b);
        m.specularColor = shine
          ? new BABYLON.Color3(0.9, 0.9, 0.9)
          : new BABYLON.Color3(0.05, 0.05, 0.05);
        m.specularPower = 64;
        m.ambientColor = new BABYLON.Color3(0, 0, 0);
        return m;
      }

      // Turned so three faces are visible at once, each at its own angle to the
      // key light.
      var cube = BABYLON.MeshBuilder.CreateBox('cube', {size: 2}, scene);
      cube.position = new BABYLON.Vector3(-1.9, 0.1, 0.1);
      cube.rotation.y = 0.5;
      cube.material = surface('cubeMat', 0.86, 0.32, 0.3, false);

      // The sphere carries the highlight - the one thing here that depends on
      // where the CAMERA is as well as where the light is, so it is what an
      // orbit is worth watching.
      var ball = BABYLON.MeshBuilder.CreateSphere('ball', {diameter: 2.2, segments: 28}, scene);
      ball.position = new BABYLON.Vector3(1.9, 0.2, -0.1);
      ball.material = surface('ballMat', 0.3, 0.6, 0.85, true);

      var ground = BABYLON.MeshBuilder.CreateGround('ground', {width: 14, height: 14}, scene);
      ground.position.y = -1;
      ground.material = surface('groundMat', 0.4, 0.42, 0.46, false);

      // A RENDER LOOP, and it must be one: Babylon compiles its effects through
      // PROMISES, which settle at the end of a turn, so a synchronous loop of
      // render() calls never sees one resolve and draws an empty frame forever.
      // It is still deterministic with nobody touching the mouse - nothing here
      // moves on its own.
      engine.runRenderLoop(function () { scene.render(); });
    </script>
  </body>
</html>

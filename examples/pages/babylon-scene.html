<!doctype html>
<!-- Babylon.js, running on this engine.

     THE THIRD LIBRARY, and a different claim from the first two. p5 and Phaser
     are 2D frameworks that happen to reach WebGL; Babylon is a 3D ENGINE - it
     brings its own scene graph, its own camera and light model, its own
     material system and a shader it assembles at run time out of a hundred
     `#define`s. Everything on this page is Babylon's; the engine underneath
     only has to answer correctly.

     DETERMINISTIC BY CONSTRUCTION, which a golden requires - but NOT by
     rendering a fixed number of times, which was the first attempt and does not
     work: Babylon compiles its effects through PROMISES, and a promise settles
     at the end of a turn, so a synchronous loop of render() calls never sees
     one resolve. It produced a golden of pure background. The page runs a real
     render loop instead, and is deterministic because the scene never changes:
     no Math.random, nothing moves, and every frame after the effect compiles is
     the same frame.

     IT IS LIT, and that is the point of the page rather than a decoration.
     Every material here takes its colour from a LIGHT: a directional light for
     the shape and a dim hemispheric one so the unlit faces are not pure black.
     Nothing uses `disableLighting`.

     That means the picture depends on the whole lighting path being right - the
     normal matrix, the light's direction in world space, the Lambert term and
     the specular exponent - and a fault in any of them shows up as a face that
     is the wrong brightness rather than as an error. tests/babylon_lighting.cpp
     checks those numbers against the arithmetic; this page is what a human
     looks at, and it is where a wrong one is OBVIOUS: the three box faces are
     lit differently on purpose, so a normal matrix that stopped arriving would
     flatten them into one colour.

     WHAT IT DRAWS, and why each piece is here rather than a prettier scene:
       - a box turned so THREE faces are visible, each at a different angle to
         the light, so the shading has to be right three times
       - a sphere, which is a continuous gradient rather than three flat faces,
         plus a specular highlight - the one thing on the page that depends on
         the view direction as well as the light direction
       - a ground plane, the only large flat area, so a change in the projection
         or the depth test shows up as a shape rather than as a few edge pixels

     tests/babylon_ratchet.cpp is the ladder and tests/babylon_api.cpp is the
     surface; this is what a HUMAN looks at, and the golden is what catches the
     render changing by accident. -->
<html>
  <head>
    <meta charset="utf-8">
    <title>Babylon.js on ctbrowser</title>
    <script src="../assets/babylon/babylon.js"></script>
    <style>
      body { margin: 0; background: #101014; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="scene" width="360" height="260"></canvas>
    <script>
      var canvas = document.getElementById('scene');
      var engine = new BABYLON.Engine(canvas, true);
      var scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.06, 0.06, 0.09, 1);

      var camera = new BABYLON.FreeCamera('camera', new BABYLON.Vector3(0, 2.2, -6.5), scene);
      camera.setTarget(new BABYLON.Vector3(0, 0.4, 0));

      // THE LIGHT THAT SHAPES THE PICTURE. A single directional light, so every
      // surface's brightness is one dot product away from its normal and a
      // wrong normal matrix is visible rather than plausible.
      var sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, 0.45), scene);
      sun.position = new BABYLON.Vector3(5, 9, -4);
      sun.intensity = 1;

      // AND A DIM AMBIENT FILL, so a face turned away from the sun is dark
      // rather than black. Without it the unlit faces are all 0,0,0 and the
      // difference between "shaded correctly" and "not drawn" disappears -
      // which is exactly the reading this page exists to make obvious.
      var fill = new BABYLON.HemisphericLight('fill', new BABYLON.Vector3(0, 1, 0), scene);
      fill.intensity = 0.25;
      fill.diffuse = new BABYLON.Color3(0.6, 0.65, 0.8);
      fill.groundColor = new BABYLON.Color3(0.12, 0.12, 0.16);

      function lit(name, r, g, b, shine) {
        var m = new BABYLON.StandardMaterial(name, scene);
        m.diffuseColor = new BABYLON.Color3(r, g, b);
        m.specularColor = shine
          ? new BABYLON.Color3(0.85, 0.85, 0.85)
          : new BABYLON.Color3(0, 0, 0);
        m.specularPower = 48;
        return m;
      }

      // TURNED SO THREE FACES SHOW, each at a different angle to the sun.
      var box = BABYLON.MeshBuilder.CreateBox('box', {size: 2}, scene);
      box.position.x = -1.7;
      box.position.y = 0.6;
      box.rotation.y = 0.6;
      box.rotation.x = 0.25;
      box.material = lit('boxMat', 0.92, 0.29, 0.29, false);

      // The sphere carries the highlight: a gradient and a specular term, which
      // is the only thing here that depends on where the CAMERA is as well as
      // where the light is.
      var ball = BABYLON.MeshBuilder.CreateSphere('ball', {diameter: 2.1, segments: 24}, scene);
      ball.position.x = 1.7;
      ball.position.y = 0.6;
      ball.material = lit('ballMat', 0.29, 0.75, 0.95, true);

      var ground = BABYLON.MeshBuilder.CreateGround('ground', {width: 9, height: 9}, scene);
      ground.position.y = -0.9;
      ground.material = lit('groundMat', 0.42, 0.44, 0.5, false);

      // A RENDER LOOP, and it has to be one. Babylon compiles its effects
      // through PROMISES, and a promise settles at the end of a turn - so a
      // synchronous `for (...) scene.render()` can never see one resolve
      // however many times it runs. That loop was the first thing written here
      // and it produced a golden of pure background, which is exactly the
      // failure a golden nobody looked at would have frozen in place.
      //
      // A LOOP IS STILL DETERMINISTIC HERE because the scene never changes:
      // nothing moves, nothing is random, and every frame after the effect
      // compiles is the same frame. The render count is fixed by the harness
      // (CTBROWSER_TEST_FRAMES), not by the page.
      engine.runRenderLoop(function () { scene.render(); });
    </script>
  </body>
</html>

# UPSTREAM'S OWN EmitC TESTS, RUN AGAINST OUR FORK OF THE EMITTER.
#
# Stage 47A of ctcompile-plan/22-lexical-cpp-backend.md: "Run upstream's OWN
# EmitC lit tests against our emitter, unmodified, as a subdirectory of our
# suite. This is the gate that keeps the fork a superset rather than a
# divergence, and it is cheap because the tests already exist."
#
# Every .mlir file in this directory is byte-for-byte
# mlir/test/Target/Cpp/<name>.mlir from llvm/llvm-project at tag llvmorg-22.1.8
# - the version cmake/LLVMVersion.cmake pins. NOTHING IN THEM IS EDITED, and
# that is the whole value: a test we adjusted to pass would be measuring our
# adjustment. Re-sync with
#
#   curl -fsSL -O https://raw.githubusercontent.com/llvm/llvm-project/\
#       llvmorg-22.1.8/mlir/test/Target/Cpp/<name>.mlir
#
# THIS FILE IS THE ONE THING THAT DIFFERS. Their RUN lines say
# `mlir-translate -mlir-to-cpp`, and the parent lit.cfg.py binds
# `mlir-translate` to LLVM's own binary - which would run UPSTREAM'S emitter and
# assert nothing about ours. Rebinding it here, for this directory only, is one
# substitution instead of 35 edited files.
#
# THE SUBSTITUTION IS PREPENDED, NOT APPENDED. lit walks the list and takes the
# FIRST pattern that matches, so appending would leave the parent's binding
# winning and the suite would pass while testing the wrong emitter - green, and
# measuring nothing, which is this project's worst failure mode.
import os

_driver = None
for _d in config.ctcompile_tools_dirs:
    _candidate = os.path.join(_d, "ctjs-translate")
    if os.path.exists(_candidate):
        _driver = _candidate
        break

if _driver is None:
    config.unsupported = True
else:
    config.substitutions.insert(0, ("mlir-translate", _driver))

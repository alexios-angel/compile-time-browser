<!doctype html>
<!-- A page this compiler must REFUSE, and the reason it has to be a fixture
     rather than a comment: there is no image path into load_module, so an
     application built from this would parse all of its JavaScript at every
     start while every count in the packager read a truthful zero. Silence is
     the failure; the refusal is the feature. -->
<html>
  <head><title>Modules</title></head>
  <body>
    <script type="module">
      const answer = 42;
      document.title = String(answer);
    </script>
  </body>
</html>

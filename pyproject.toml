# The repository's Python dependencies, managed by uv (tools/Brewfile installs
# it). Every script runs on the standard library alone except these tools, and
# each has its own dependency group, installed into /.venv at the repository root
# and pinned by uv.lock:
#
# - test: lit and psutil, which lit needs to enforce the per-test time limit
#   (ctcompile/test/lit.cfg.py). tools/remote-build.sh syncs this group on the
#   build box, and ctcompile/test/cmake/Lit.cmake finds .venv/bin/lit. lit is
#   held at 18.1.8, the version the boxes' ~/.lit-venv ran the suite with: lit
#   23 refuses lit.cfg.py's external shell (ShTest(execute_external=True)), and
#   moving every RUN line to lit's internal shell is a change of its own.
# - compare: Playwright and Pillow, for tools/check/compare.py and
#   css-parity.py (`tools/check/compare.py setup` syncs them).
# - dev: ruff, the Python half of tools/format.sh (`uv run ruff`). uv installs
#   this group by default.
#
# The project is not a package: uv installs only the groups, never the tree.
[project]
name = "compile-time-browser"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = ["lit==18.1.8", "psutil"]
compare = ["playwright>=1.40,<2", "pillow>=10,<13"]
dev = ["ruff"]

# tools/format.sh runs `ruff format` over every tracked .py with this file as its
# whole configuration (black until 2026-10-10; ruff's formatter is its drop-in).
# 100 columns is what .clang-format already says for the C++; the exclusions are
# the same as the formatter's other half - nothing vendored and nothing built.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third-party", "build*"]
